<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>L'Oréal Beauty Advisor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-wrapper">
    <header class="site-header">
      <img src="img/loreal-logo.png" alt="L'Oréal" class="logo" />
      <h1 class="site-title">Smart Product Advisor</h1>
    </header>

    <main>
      <p id="latestQuestion" class="latest-question" hidden></p>
      <div id="chatWindow" class="chat-window" aria-live="polite"></div>

      <form id="chatForm" class="chat-form">
        <label for="userInput" class="visually-hidden">Message</label>
        <input id="userInput" type="text" placeholder="Ask me about products or routines…" autocomplete="off" required />
        <button id="sendBtn" type="submit">Send</button>
      </form>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 L'Oréal. All rights reserved.</p>
      <nav>
        <a href="https://www.loreal.com/en/privacy-policy/" target="_blank" rel="noopener">Privacy</a>
        <a href="https://www.loreal.com/en/terms-of-use/" target="_blank" rel="noopener">Terms</a>
        <a href="https://www.loreal.com/en/contact/" target="_blank" rel="noopener">Contact</a>
      </nav>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
